<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Gastos - Planner Floral</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="planner-wrapper">
        <!-- Argolinhas do Espiral no Topo -->
        <div class="spiral-container">
            <div class="spiral"></div><div class="spiral"></div><div class="spiral"></div><div class="spiral"></div>
            <div class="spiral"></div><div class="spiral"></div><div class="spiral"></div><div class="spiral"></div>
            <div class="spiral"></div><div class="spiral"></div><div class="spiral"></div><div class="spiral"></div>
            <div class="spiral"></div><div class="spiral"></div><div class="spiral"></div><div class="spiral"></div>
        </div>

        <div class="container">
            <header>
                <h1>Controle de Gastos</h1>
            </header>

            <main>
                <!-- CARDS DE RESUMO -->
                <section class="summary-container">
                    <div class="card card-pagar">
                        <h3>Total a Pagar</h3>
                        <p id="Pagar">R$ 0,00</p>
                    </div>
                    <div class="card card-recebido">
                        <h3>Total Recebido</h3>
                        <p id="Recebido">R$ 0,00</p>
                    </div>
                    <div class="card card-restante">
                        <h3>Saldo Restante</h3>
                        <p id="Restante">R$ 0,00</p>
                    </div>
                </section>
     
                <!-- FORMULÁRIO -->
                <section class="form-container">
                    <h2>Adicionar Movimentação</h2>
                    <form id="Formulario">
                        <div class="input-group">
                            <label for="Descricao">Descrição</label>
                            <input type="text" id="Descricao" required placeholder="Ex: Conta de Luz, Salário...">
                        </div>
                        
                        <div class="input-group">
                            <label for="quantia">Valor (R$)</label>
                            <input type="number" id="quantia" required step="0.01" placeholder="Ex: 150.00">
                        </div>

                        <div class="input-group radio-group">
                            <label>
                                <input type="radio" name="type" value="entrada" required> Entrada
                            </label>
                            <label>
                                <input type="radio" name="type" value="saida"> Saída
                            </label>
                        </div>

                        <div class="input-group">
                            <label for="Categoria">Categoria</label>
                            <select id="Categoria" required>
                                <option value="Alimentação">Alimentação</option>
                                <option value="Transporte">Transporte</option>
                                <option value="Lazer">Lazer</option>
                                <option value="Salário">Salário</option>
                                <option value="Outros">Outros</option>
                            </select>
                        </div>

                        <button type="submit">Adicionar</button>
                    </form>
                </section>

                <!-- TABELA E FILTROS -->
                <section class="transactions-container">
                    <h2>Movimentações</h2>
                    
                    <!-- BARRA DE BUSCA + ÍCONE DE FILTRAR COM MENU SUSPENSO -->
                    <div style="position: relative; margin-bottom: 24px;">
                        <div style="display: flex; gap: 10px;">
                            <input type="search" id="campoBusca" placeholder="Pesquise por descrição ou valor..." style="flex: 1; padding: 14px 16px; border-radius: 12px; border: 2px solid #b8c5e0; background-color: #faf6f0; font-size: 1rem; outline: none; color: #2d3748;">
                            
                            <!-- BOTÃO COM O ÍCONE DE FILTRAR -->
                            <button type="button" id="btnToggleFiltros" style="padding: 0 18px; border-radius: 12px; border: 2px solid #b8c5e0; background-color: #faf6f0; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s;">
                                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4a5568" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                    <circle cx="10" cy="6" r="3"></circle>
                                    <line x1="3" y1="6" x2="7" y2="6"></line>
                                    <line x1="13" y1="6" x2="21" y2="6"></line>
                                    <circle cx="16" cy="14" r="3"></circle>
                                    <line x1="3" y1="14" x2="13" y2="14"></line>
                                    <line x1="19" y1="14" x2="21" y2="14"></line>
                                    <circle cx="8" cy="22" r="3"></circle>
                                    <line x1="3" y1="22" x2="5" y2="22"></line>
                                    <line x1="11" y1="22" x2="21" y2="22"></line>
                                </svg>
                            </button>
                        </div>
                        
                        <!-- MENU SUSPENSO DE FILTROS -->
                        <div id="painelFiltros" style="display: none; position: absolute; top: 100%; right: 0; margin-top: 8px; background: #faf6f0; padding: 18px; border-radius: 14px; border: 2px solid #b8c5e0; box-shadow: 0 10px 25px rgba(0,0,0,0.1); z-index: 10; width: 240px; flex-direction: column; gap: 12px;">
                            <div>
                                <label for="filtroCategoria" style="display: block; margin-bottom: 6px; font-weight: 600; color: #4a5568; font-size: 0.85rem;">Categoria</label>
                                <select id="filtroCategoria" style="width: 100%; padding: 10px; border-radius: 8px; border: 1.5px solid #b8c5e0; font-size: 0.9rem; background: #ffffff; outline: none;">
                                    <option value="todas">Todas</option>
                                    <option value="Alimentação">Alimentação</option>
                                    <option value="Transporte">Transporte</option>
                                    <option value="Lazer">Lazer</option>
                                    <option value="Salário">Salário</option>
                                    <option value="Outros">Outros</option>
                                </select>
                            </div>
                            <div>
                                <label for="filtroTipo" style="display: block; margin-bottom: 6px; font-weight: 600; color: #4a5568; font-size: 0.85rem;">Tipo</label>
                                <select id="filtroTipo" style="width: 100%; padding: 10px; border-radius: 8px; border: 1.5px solid #b8c5e0; font-size: 0.9rem; background: #ffffff; outline: none;">
                                    <option value="todos">Todos</option>
                                    <option value="entrada">Entrada</option>
                                    <option value="saida">Saída</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="table-wrapper">
                        <table id="transactions-table">
                            <thead>
                                <tr>
                                    <th>Descrição</th>
                                    <th>Categoria</th>
                                    <th>Valor</th>
                                    <th>Tipo</th>
                                    <th>Ações</th>
                                </tr>
                            </thead>
                            <tbody id="Lista">
                            </tbody>
                        </table>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
